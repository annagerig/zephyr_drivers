description: |
  STMicroelectronics STM32U3 HSP (Signal Processing Engine) hardware FFT
  accelerator. Exposes a real-FFT device API; the driver boots the engine with
  ST's firmware and issues direct accelerator commands.

compatible: "st,stm32u3-hsp"

include: [base.yaml]

properties:
  reg:
    required: true
  clocks:
    required: true
  interrupts:
    required: true
